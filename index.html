<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<!-- LOCK VIEWPORT MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

/* ===== LOCK SCREEN ===== */
html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 overflow:hidden;
 position:fixed;
 touch-action:none;
 font-family:'Poppins',sans-serif;
 background:linear-gradient(135deg,#ff9ab5,#ff6f91);
 color:white;
}

/* ===== CONTAINER FULLSCREEN ===== */
.container{
 position:fixed;
 inset:0;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 padding:20px;
 box-sizing:border-box;
 overflow:hidden;
 z-index:2;
}

/* PAGE */
.page{
 display:none;
 flex-direction:column;
 align-items:center;
 max-width:600px;
 width:100%;
 max-height:100vh;
 overflow:hidden;
}
.page.active{display:flex;}

h1{
 font-family:'Great Vibes',cursive;
 font-size:clamp(28px,5vw,45px);
 margin:0;
}

/* IMAGE RESPONSIVE */
img{
 width:clamp(180px,60vw,240px);
 height:auto;
 border-radius:20px;
 margin:20px 0;
 box-shadow:0 10px 25px rgba(0,0,0,.3);
}

/* TEXT */
p{
 font-size:clamp(14px,2.8vw,16px);
 line-height:1.5;
 margin:0;
}

/* BUTTON */
button{
 margin-top:25px;
 padding:12px 28px;
 border:none;
 border-radius:25px;
 font-size:16px;
 background:white;
 color:#ff4d6d;
 cursor:pointer;
}

/* LOVE RAIN */
.loveRain{
 position:absolute;
 top:-50px;
 font-size:22px;
 animation:fall linear forwards;
 opacity:.8;
}

@keyframes fall{
 to{transform:translateY(110vh);}
}

/* FIREWORK */
.flower{
 position:absolute;
 width:8px;
 height:8px;
 border-radius:50%;
 pointer-events:none;
 animation:explode 1.6s forwards;
 filter:drop-shadow(0 0 6px white);
}

@keyframes explode{
 0%{transform:translate(0,0) scale(.5);opacity:1}
 100%{transform:translate(var(--x),var(--y)) scale(2);opacity:0}
}

/* GIFT BOX */
.gift{
 width:120px;
 height:120px;
 border-radius:20px;
 background:rgba(255,255,255,.3);
 backdrop-filter:blur(10px);
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:50px;
 animation:float 3s infinite ease-in-out;
}

@keyframes float{
 50%{transform:translateY(-25px);}
}

</style>
</head>

<body>

<div class="container" id="mainContent">

<div class="page active">
<h1>Haii Cantikk</h1>
<img src="gambar1.gif">
<p class="typing" data-text="Lucu ya… kita udah kenal dari kecil, sd bareng, main bareng, sering berantem wkwkwk"></p>
<button onclick="nextPage()">Next ❤️</button>
</div>

<div class="page">
<img src="gambar2.gif">
<p class="typing" data-text="Entah kenapa kali ini beda, aku ngerasa nyaman bukan sekedar teman, tapi ada hal lain yang sulit aku jelaskan, mungkin butuh berjuta2 kertas untuk menggambarkanya, berjuta2 kata untuk mengungkapkannya"></p>
<button onclick="nextPage()">Next ❤️</button>
</div>

<div class="page">
<img src="gambar3.gif">
<p class="typing" data-text="Aku mau serius, dan aku akan buktikan dengan caraku sendiri, aku mau jadi diriku sendiri, apapun aku akan usahakan menjadi yang terbaik, bantu doanya yaa hihi..."></p>
<button onclick="nextPage()">Next ❤️</button>
</div>

<div class="page">
<img src="gambar4.gif">
<p class="typing" data-text="Apapun nanti hasilnya, aku harap itu yang terbaik buat kita, happy valentine iluhh❤️"></p>
<button onclick="nextPage()">Buka Hadiah 🎁</button>
</div>

<div class="page">
<div class="gift">🍦</div>
<p class="typing" data-text="Ice Creamnya malu katanya, soalnya kalah manis sama kamu <3"></p>
<button onclick="nextPage()">Next ➜</button>
</div>

<div class="page">
<div class="gift">🍫</div>
<p class="typing" data-text="Coklatnya virtual dulu ya hihi.. nanti yang real menyusul"></p>
<button onclick="nextPage()">Next ➜</button>
</div>

<div class="page">
<div class="gift">🧸</div>
<p class="typing" data-text="lucu kan?"></p>
<button onclick="startSurprise()">Surprise 🌸</button>
</div>

</div>

<audio id="music" autoplay loop>
<source src="song.mp3" type="audio/mp3">
</audio>

<script>

const music=document.getElementById("music");

/* AUTOPLAY MUSIC */
music.currentTime=localStorage.getItem("musicTime")||0;

music.play().catch(()=>{
 document.body.addEventListener("click",()=>music.play(),{once:true});
});

setInterval(()=>{
 localStorage.setItem("musicTime",music.currentTime);
},1000);

/* PAGE NAVIGATION */
let currentPage=0;
const pages=document.querySelectorAll(".page");

function nextPage(){
 pages[currentPage].classList.remove("active");
 currentPage++;
 pages[currentPage].classList.add("active");

 const p=pages[currentPage].querySelector(".typing");
 if(p) typeText(p,p.dataset.text);
}

/* TYPE TEXT EFFECT */
function typeText(el,text,delay=35){
 el.innerHTML="";
 let i=0;
 (function typing(){
  if(i<text.length){
   el.innerHTML+=text[i++];
   setTimeout(typing,delay);
  }
 })();
}

typeText(
 pages[0].querySelector(".typing"),
 pages[0].querySelector(".typing").dataset.text
);

/* LOVE RAIN */
let loveInterval=setInterval(createLove,400);

function createLove(){
 const love=document.createElement("div");
 love.className="loveRain";
 love.innerHTML="💖";
 love.style.left=Math.random()*100+"%";
 love.style.animationDuration=(4+Math.random()*4)+"s";
 love.style.color=`hsl(${Math.random()*360},70%,75%)`;
 document.body.appendChild(love);
 setTimeout(()=>love.remove(),9000);
}

/* FIREWORK */
let fireInterval=null;

function createFirework(x,y){
 const petals=45;
 const hue=Math.random()*360;

 for(let i=0;i<petals;i++){
  const f=document.createElement("div");
  f.className="flower";

  const angle=(Math.PI*2)*i/petals;
  const radius=150+Math.random()*100;

  f.style.left=x+"px";
  f.style.top=y+"px";
  f.style.background=`hsl(${hue},80%,70%)`;

  f.style.setProperty("--x",Math.cos(angle)*radius+"px");
  f.style.setProperty("--y",Math.sin(angle)*radius+"px");

  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1600);
 }
}

/* SURPRISE MODE */
function startSurprise(){
 document.getElementById("mainContent").style.display="none";

 clearInterval(loveInterval);
 loveInterval=setInterval(createLove,150);

 fireInterval=setInterval(()=>{
  createFirework(
   Math.random()*window.innerWidth,
   Math.random()*window.innerHeight*0.8
  );
 },500);
}

</script>

</body>
</html>
