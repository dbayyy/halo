<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

/* ===== RESET & LOCK ===== */
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 touch-action:none;
 font-family:'Poppins',sans-serif;
 background:linear-gradient(135deg,#ff9ab5,#ff6f91);
 color:white;
}

/* ===== FULL SCREEN FIX (ANTI GESER) ===== */
body{
 position:fixed;
 inset:0;
}

/* ===== CONTAINER ===== */
.container{
 position:fixed;
 inset:0;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 text-align:center;
}

/* ===== PAGE ===== */
.page{
 display:none;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 width:100%;
 max-width:500px;
 height:100dvh;
}
.page.active{display:flex;}

/* ===== TITLE ===== */
h1{
 font-family:'Great Vibes',cursive;
 font-size:clamp(28px,6vw,42px);
 margin-bottom:10px;
}

/* ===== IMAGE ===== */
img{
 width:clamp(160px,60vw,220px);
 height:auto;
 border-radius:20px;
 margin:15px 0;
 object-fit:cover;
}

/* ===== TEXT ===== */
p{
 font-size:clamp(14px,3.5vw,16px);
 line-height:1.5;
 padding:0 10px;
}

/* ===== BUTTON ===== */
button{
 margin-top:20px;
 padding:12px 20px;
 border:none;
 border-radius:25px;
 font-size:14px;
 background:white;
 color:#ff4d6d;
 cursor:pointer;
 width:fit-content;
 max-width:90%;
}

/* ===== BUTTON GROUP ===== */
.btn-group{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 justify-content:center;
}

/* ===== GIFT ===== */
.gift{
 width:100px;
 height:100px;
 border-radius:20px;
 background:rgba(255,255,255,.3);
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:40px;
 margin-top:20px;
}

/* ===== LOVE EFFECT ===== */
.love{
 position:absolute;
 font-size:18px;
 animation:explode 2s forwards;
 pointer-events:none;
}

@keyframes explode{
 0%{transform:scale(0);opacity:1;}
 100%{transform:translate(var(--x),var(--y)) scale(2);opacity:0;}
}

/* ===== RESPONSIVE TAMBAHAN ===== */
@media (max-height:600px){
 img{width:140px;}
 h1{font-size:24px;}
}

</style>
</head>

<body>

<div class="container" id="mainContent">

<div class="page active">
<h1>Hai kamu ❤️</h1>
<img src="gambar1.jfif">
<p class="typing" data-text="Haii ariii... kita temenan udah lama banget ya"></p>
<button onclick="nextPage()">Lanjut ❤️</button>
</div>

<div class="page">
<img src="gambar1.jfif">
<p class="typing" data-text="Aku ngerasa sekarang situasinya beda, aku nyaman banget lebih dari sekedar teman"></p>
<button onclick="nextPage()">Lanjut ❤️</button>
</div>

<div class="page">
<img src="gambar1.jfif">
<p class="typing" data-text="alasan? mungkin butuh berjuta-juta kertas untuk menuliskan, beribu - ribu kata untuk menjelaskan"></p>
<button onclick="nextPage()">Lanjut ❤️</button>
</div>

<!-- NEMBAK -->
<div class="page">
<img src="gambar1.jfif">
<p class="typing" data-text="aku mau serius sama kamu, aku mau kita lebih dari sekedar teman, kamu mau jadi pacarku? ❤️"></p>

<div class="btn-group">
<button onclick="jawabanMau()">Yes</button>
<button onclick="jawabanTidak()">No</button>
</div>
</div>

<!-- MAU -->
<div class="page">
<h1>Makasi Sayanggg</h1>
<img src="gambar2.gif">
<p class="typing" data-text="makasi sayang udah mau jadi pacarku, aku janji buat bahagiain kamu dengan caraku sendiri"></p>
<button onclick="nextPage()">For you</button>
</div>

<!-- HADIAH -->
<div class="page">
<div class="gift">🎁</div>
<p class="typing" data-text="I Love You "></p>
<button onclick="startSurprise()">Buka</button>
</div>

<!-- TIDAK -->
<div class="page">
<img src="gambar3.jfif">
<p class="typing" data-text="hummmm"></p>
</div>

</div>

<script>

let currentPage=0;
const pages=document.querySelectorAll(".page");

/* NEXT */
function nextPage(){
 pages[currentPage].classList.remove("active");
 currentPage++;
 pages[currentPage].classList.add("active");

 const p=pages[currentPage].querySelector(".typing");
 if(p) typeText(p,p.dataset.text);
}

/* TYPE */
function typeText(el,text){
 el.innerHTML="";
 let i=0;
 function typing(){
  if(i<text.length){
   el.innerHTML+=text[i++];
   setTimeout(typing,30);
  }
 }
 typing();
}

typeText(
 pages[0].querySelector(".typing"),
 pages[0].querySelector(".typing").dataset.text
);

/* JAWABAN */
function jawabanMau(){
 pages[currentPage].classList.remove("active");
 currentPage++;
 pages[currentPage].classList.add("active");

 const p=pages[currentPage].querySelector(".typing");
 if(p) typeText(p,p.dataset.text);
}

function jawabanTidak(){
 pages[currentPage].classList.remove("active");
 currentPage=pages.length-1;
 pages[currentPage].classList.add("active");

 const p=pages[currentPage].querySelector(".typing");
 if(p) typeText(p,p.dataset.text);
}

/* LOVE EXPLOSION */
function createLoveExplosion(x,y){
 for(let i=0;i<80;i++){
  const love=document.createElement("div");
  love.className="love";
  love.innerHTML="💖";

  const angle=Math.random()*2*Math.PI;
  const radius=100+Math.random()*200;

  love.style.left=x+"px";
  love.style.top=y+"px";

  love.style.setProperty("--x",Math.cos(angle)*radius+"px");
  love.style.setProperty("--y",Math.sin(angle)*radius+"px");

  document.body.appendChild(love);

  setTimeout(()=>love.remove(),2000);
 }
}

function startSurprise(){
 document.getElementById("mainContent").style.display="none";

 setInterval(()=>{
  createLoveExplosion(
   Math.random()*window.innerWidth,
   Math.random()*window.innerHeight
  );
 },200);
}

</script>

</body>
</html>
